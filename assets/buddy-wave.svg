<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" class="anim" role="img" aria-label="The ai-connector plug waving hello"><style>@keyframes swing { from { transform: rotate(var(--from)); } to { transform: rotate(var(--to)); } }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-1.5px); } 75% { transform: translateX(1.5px); } }
@keyframes float-z { from { opacity: 0; transform: translate(0, 4px); } 50% { opacity: 1; } to { opacity: 0; transform: translate(4px, -8px); } }
.anim .limb { animation: swing var(--dur, .32s) ease-in-out infinite alternate; }
.anim .bob { animation: bob .16s ease-in-out infinite alternate; }
.anim .shake { animation: shake .3s linear infinite; }
.anim .zz { animation: float-z 2.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .anim * { animation: none !important; } }</style><defs>
<linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
<stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#3730a3"/>
</linearGradient>
<!-- A. Plug: two prongs into a body that holds the AI spark. -->
<symbol id="mark-plug" viewBox="0 0 64 64">
<rect x="10" y="23" width="16" height="5" rx="2.5" fill="currentColor"/>
<rect x="10" y="36" width="16" height="5" rx="2.5" fill="currentColor"/>
<path d="M24 16h10a16 16 0 0 1 0 32H24z" fill="currentColor"/>
<path d="M35 23Q35 32 44 32Q35 32 35 41Q35 32 26 32Q35 32 35 23Z" style="fill:var(--cut, url(#tile))"/>
</symbol>
<!-- Depth: shared paints and filters for the dimensional plug variants. -->
<linearGradient id="tile-deep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
<stop offset="0" stop-color="#7c7ff8"/><stop offset=".55" stop-color="#4f46e5"/><stop offset="1" stop-color="#312e81"/>
</linearGradient>
<radialGradient id="tile-night" gradientUnits="userSpaceOnUse" cx="34" cy="30" r="44">
<stop offset="0" stop-color="#3b3a8f"/><stop offset=".6" stop-color="#1e1b4b"/><stop offset="1" stop-color="#0c0a24"/>
</radialGradient>
<linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="30">
<stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
<stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".4" stop-color="#fff" stop-opacity=".08"/>
<stop offset="1" stop-color="#000" stop-opacity=".25"/>
</linearGradient>
<linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="48">
<stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#eceeff"/><stop offset="1" stop-color="#c9cdf7"/>
</linearGradient>
<linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="5">
<stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#c3c8d6"/>
<stop offset=".7" stop-color="#8d94a8"/><stop offset="1" stop-color="#e3e6ee"/>
</linearGradient>
<linearGradient id="carve" gradientUnits="userSpaceOnUse" x1="0" y1="23" x2="0" y2="41">
<stop offset="0" stop-color="#312e81"/><stop offset="1" stop-color="#6366f1"/>
</linearGradient>
<radialGradient id="ember" gradientUnits="userSpaceOnUse" cx="35" cy="32" r="9">
<stop offset="0" stop-color="#fffbeb"/><stop offset=".45" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/>
</radialGradient>
<!-- Old to new: tile turns from legacy stone (left) to AI indigo (right). -->
<linearGradient id="tile-shift" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="64" y2="44">
<stop offset="0" stop-color="#a8a29e"/><stop offset=".38" stop-color="#8580b4"/>
<stop offset=".7" stop-color="#4f46e5"/><stop offset="1" stop-color="#312e81"/>
</linearGradient>
<!-- Mascot paints. Bounding-box gradients so they scale with the shape. -->
<linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f5f5f4"/><stop offset=".5" stop-color="#d6d3d1"/><stop offset="1" stop-color="#a8a29e"/>
</linearGradient>
<linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eef0ff"/><stop offset="1" stop-color="#c7cbf5"/>
</linearGradient>
<linearGradient id="head-off" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f5f5f4"/><stop offset="1" stop-color="#bdb8b3"/>
</linearGradient>
<linearGradient id="prong" x1="0" y1="0" x2="1" y2="0">
