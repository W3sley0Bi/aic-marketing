</linearGradient>
<linearGradient id="side-shade" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".1" stop-color="#fff" stop-opacity="0"/>
<stop offset=".72" stop-color="#1e1b4b" stop-opacity="0"/><stop offset="1" stop-color="#1e1b4b" stop-opacity=".2"/>
</linearGradient>
<linearGradient id="bottom-ao" x1="0" y1="0" x2="0" y2="1">
<stop offset=".55" stop-color="#1e1b4b" stop-opacity="0"/><stop offset="1" stop-color="#1e1b4b" stop-opacity=".22"/>
</linearGradient>
<linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#666d82"/><stop offset=".3" stop-color="#e6e9f1"/><stop offset=".42" stop-color="#ffffff"/>
<stop offset=".7" stop-color="#a6acbe"/><stop offset="1" stop-color="#585f73"/>
</linearGradient>
<linearGradient id="rubber" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#46424c"/><stop offset=".38" stop-color="#8f8a96"/><stop offset="1" stop-color="#55505b"/>
</linearGradient>
<linearGradient id="flange" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f1f2f5"/><stop offset=".5" stop-color="#b9bdc9"/><stop offset="1" stop-color="#7e8496"/>
</linearGradient>
<radialGradient id="spark3d" cx=".4" cy=".35" r=".7">
<stop offset="0" stop-color="#fffbeb"/><stop offset=".45" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/>
</radialGradient>
<!-- Cord rubber: legacy grey at the far end, turning indigo-tinted near the new plug. -->
<linearGradient id="cord-3d" gradientUnits="userSpaceOnUse" x1="18" y1="0" x2="60" y2="0">
<stop offset="0" stop-color="#8a8590"/><stop offset="1" stop-color="#aaa7d2"/>
</linearGradient>
<linearGradient id="cord-3d-long" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="160" y2="0">
<stop offset="0" stop-color="#8a8590"/><stop offset="1" stop-color="#aaa7d2"/>
</linearGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
<filter id="shadow" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="3.5"/></filter>
<filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
<feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#1e1b4b" flood-opacity=".5"/>
</filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
<feGaussianBlur stdDeviation="2.4" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
