<stop offset=".7" stop-color="#c3c8d6"/><stop offset="1" stop-color="#7d8499"/>
</linearGradient>
<!-- Cord: legacy grey at the far end, indigo where it meets the AI head. -->
<linearGradient id="cord" gradientUnits="userSpaceOnUse" x1="10" y1="0" x2="32" y2="0">
<stop offset="0" stop-color="#a8a29e"/><stop offset="1" stop-color="#a5b4fc"/>
</linearGradient>
<linearGradient id="cord-long" gradientUnits="userSpaceOnUse" x1="42" y1="0" x2="130" y2="0">
<stop offset="0" stop-color="#a8a29e"/><stop offset=".5" stop-color="#b9b6cf"/><stop offset="1" stop-color="#a5b4fc"/>
</linearGradient>
<!-- Rendered (3D) plug materials. Bounding-box gradients: light comes from the top left. -->
<radialGradient id="tile-light" gradientUnits="userSpaceOnUse" cx="22" cy="16" r="62">
<stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eff0fa"/><stop offset="1" stop-color="#d8dbef"/>
