<linearGradient id="front-off" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f5f5f4"/><stop offset="1" stop-color="#b3aea8"/>
</linearGradient>
<linearGradient id="top-off" x1="0" y1="0" x2="0" y2="1">
